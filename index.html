<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>동작 인식 벌레 잡기 게임</title>
    <!-- TensorFlow.js 및 Teachable Machine Pose 라이브러리 로드 -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.7.4/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/pose@0.8.6/dist/teachablemachine-pose.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Pretendard', sans-serif;
            background-color: #1a1a1a;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        h1 {
            margin-bottom: 10px;
            font-size: 24px;
        }
        #game-container {
            position: relative;
            width: 640px;
            height: 480px;
            border: 4px solid #444;
            border-radius: 12px;
            overflow: hidden;
            background-color: #000;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        #webcam-video, #canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 640px;
            height: 480px;
            transform: scaleX(-1); /* 좌우 반전 (거울 모드) */
        }
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 15px;
        }
        .hud {
            display: flex;
            justify-content: space-between;
            font-size: 20px;
            font-weight: bold;
            background: rgba(0, 0, 0, 0.6);
            padding: 10px 20px;
            border-radius: 8px;
        }
        /* 판정 영역 (정중앙) 표시 */
        #target-zone {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 100px;
            height: 100px;
            transform: translate(-50%, -50%);
            border: 3px dashed rgba(255, 255, 0, 0.7);
            border-radius: 50%;
            pointer-events: none;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { transform: translate(-50%, -50%) scale(1); opacity: 0.7; }
            50% { transform: translate(-50%, -50%) scale(1.1); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(1); opacity: 0.7; }
        }
        #pose-status {
            text-align: center;
            font-size: 18px;
            background: rgba(0, 0, 0, 0.6);
            padding: 6px 12px;
            border-radius: 20px;
            align-self: center;
        }
        #start-screen, #game-over-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }
        button {
            margin-top: 20px;
            padding: 12px 30px;
            font-size: 18px;
            font-weight: bold;
            color: #fff;
            background-color: #e74c3c;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: 0.2s;
        }
        button:hover {
            background-color: #c0392b;
            transform: scale(1.05);
        }
        .guide {
            margin-top: 15px;
            font-size: 14px;
            color: #ccc;
            text-align: center;
            line-height: 1.6;
        }
    </style>
</head>
<body>

    <h1>🪰 동작 인식 리듬 포획 게임 🪳</h1>

    <div id="game-container">
        <!-- 웹캠 및 스켈레톤 출력 캔버스 -->
        <video id="webcam-video" autoplay playsinline></video>
        <canvas id="canvas" width="640" height="480"></canvas>

        <!-- 게임 UI -->
        <div id="ui-layer">
            <div class="hud">
                <div>SCORE: <span id="score-val">0</span></div>
                <div>LEVEL: <span id="level-val">1</span></div>
                <div>LIFE: <span id="life-val">❤️❤️❤️</span></div>
            </div>
            <div id="target-zone"></div>
            <div id="pose-status">인식 대기 중...</div>
        </div>

        <!-- 시작 화면 -->
        <div id="start-screen">
            <h2>게임 준비</h2>
            <div class="guide">
                <p><strong>[조작 방법]</strong></p>
                <p>🪳 <strong>바퀴벌레</strong>가 중앙에 오면 👉 <strong>[주먹]</strong> 포즈!</p>
                <p>🪰 <strong>파리</strong>가 중앙에 오면 👉 <strong>[박수]</strong> 포즈!</p>
                <br>
                <p>※ 웹캠 연결 및 파일 위치(model.json, weights.bin, metadata.json)를 확인하세요.</p>
            </div>
            <button id="start-btn" onclick="startGame()">게임 시작</button>
        </div>

        <!-- 게임 오버 화면 -->
        <div id="game-over-screen" style="display: none;">
            <h2>GAME OVER</h2>
            <p style="font-size: 20px; margin-top: 10px;">최종 점수: <span id="final-score">0</span></p>
            <button onclick="restartGame()">다시 하기</button>
        </div>
    </div>

    <script>
        // 모델 경로 설정 (동일 폴더 내 파일 위치)
        const MODEL_URL = "./model.json";
        const METADATA_URL = "./metadata.json";

        let model, webcam, maxPredictions;
        let isGameRunning = false;
        
        // 게임 상태 변수
        let score = 0;
        let level = 1;
        let lives = 3;
        let currentPose = "";
        let poseConfidence = 0;

        // 게임 루프 및 스폰 제어 변수
        let bugs = [];
        let lastSpawnTime = 0;
        let spawnInterval = 2000; // 초기 생성 주기 (ms)
        let bugSpeed = 2; // 초기 이동 속도

        const canvas = document.getElementById("canvas");
        const ctx = canvas.getContext("2d");

        // 모델 로드 및 웹캠 설정
        async function initTM() {
            document.getElementById("pose-status").innerText = "모델 로딩 중...";
            try {
                model = await tmPose.load(MODEL_URL, METADATA_URL);
                maxPredictions = model.getTotalClasses();

                // 웹캠 설정
                const size = 640;
                const flip = true;
                webcam = new tmPose.Webcam(size, 480, flip);
                await webcam.setup();
                await webcam.play();
                
                document.getElementById("webcam-video").srcObject = webcam.webcam.srcObject;
                document.getElementById("pose-status").innerText = "준비 완료!";
                document.getElementById("start-btn").disabled = false;
                
                // 추론 루프 시작
                window.requestAnimationFrame(loop);
            } catch (e) {
                alert("모델 또는 웹캠을 로드하는 데 실패했습니다. 파일 경로(model.json, weights.bin, metadata.json)와 웹캠 권한을 확인해 주세요.");
                console.error(e);
            }
        }

        async function loop(timestamp) {
            webcam.update();
            await predict();
            if (isGameRunning) {
                updateGame(timestamp);
            }
            drawCanvas();
            window.requestAnimationFrame(loop);
        }

        // 동작 인식 추론
        async function predict() {
            const { pose, posenetOutput } = await model.estimatePose(webcam.canvas);
            const prediction = await model.predict(posenetOutput);

            let highestProb = 0;
            let bestClass = "대기";

            for (let i = 0; i < maxPredictions; i++) {
                if (prediction[i].probability > highestProb) {
                    highestProb = prediction[i].probability;
                    bestClass = prediction[i].className;
                }
            }

            // 임계값 0.75 이상일 때만 동작 인식 적용
            if (highestProb > 0.75) {
                currentPose = bestClass;
                poseConfidence = highestProb;
                document.getElementById("pose-status").innerText = `인식: ${currentPose} (${Math.round(highestProb * 100)}%)`;
            } else {
                currentPose = "None";
                document.getElementById("pose-status").innerText = "동작 취하는 중...";
            }
        }

        // 게임 시작
        function startGame() {
            score = 0;
            level = 1;
            lives = 3;
            bugs = [];
            spawnInterval = 2000;
            bugSpeed = 2.5;
            
            updateHUD();
            document.getElementById("start-screen").style.display = "none";
            document.getElementById("game-over-screen").style.display = "none";
            isGameRunning = true;
            lastSpawnTime = performance.now();
        }

        function restartGame() {
            startGame();
        }

        // 벌레 스폰 (좌/우/상/하에서 중앙으로 이동)
        function spawnBug() {
            const types = ['roach', 'fly']; // roach: 바퀴벌레(주먹), fly: 파리(박수)
            const type = types[Math.floor(Math.random() * types.length)];
            
            // 화면 외곽 4방향 중 무작위 시작 지점 설정
            const targetX = 320;
            const targetY = 240;
            let startX, startY;

            const edge = Math.floor(Math.random() * 4);
            if (edge === 0) { startX = Math.random() * 640; startY = -30; } // 상
            else if (edge === 1) { startX = 670; startY = Math.random() * 480; } // 우
            else if (edge === 2) { startX = Math.random() * 640; startY = 510; } // 하
            else { startX = -30; startY = Math.random() * 480; } // 좌

            const angle = Math.atan2(targetY - startY, targetX - startX);

            bugs.push({
                x: startX,
                y: startY,
                type: type,
                speed: bugSpeed,
                vx: Math.cos(angle) * bugSpeed,
                vy: Math.sin(angle) * bugSpeed,
                size: 40,
                hit: false
            });
        }

        // 게임 상태 업데이트
        function updateGame(timestamp) {
            // 레벨 디자인: 점수에 따른 난이도 상승 (속도 및 리듬 증대)
            const newLevel = Math.floor(score / 50) + 1;
            if (newLevel !== level) {
                level = newLevel;
                bugSpeed = 2.5 + (level * 0.5);
                spawnInterval = Math.max(700, 2000 - (level * 200)); // 스폰 주기 단축
                updateHUD();
            }

            // 벌레 생성 주기 체크
            if (timestamp - lastSpawnTime > spawnInterval) {
                spawnBug();
                lastSpawnTime = timestamp;
            }

            // 벌레 이동 및 판정
            for (let i = bugs.length - 1; i >= 0; i--) {
                let b = bugs[i];
                b.x += b.vx;
                b.y += b.vy;

                // 정중앙 타겟 영역(반지름 50px) 도달 여부 계산
                const distToCenter = Math.hypot(b.x - 320, b.y - 240);

                if (distToCenter < 45) { // 정중앙 판정 범위 내 들어옴
                    let success = false;

                    // 동작 매칭 조건 (거울 모드 상태이므로 보이는 화면 기준으로 작동)
                    if (b.type === 'roach' && currentPose === '주먹') {
                        success = true;
                    } else if (b.type === 'fly' && currentPose === '박수') {
                        success = true;
                    }

                    if (success) {
                        score += 10;
                        updateHUD();
                        bugs.splice(i, 1);
                        continue;
                    }
                }

                // 중앙을 지나치거나 놓친 경우 (거리 넘어가면 라이프 차감)
                if (distToCenter < 5) {
                    lives--;
                    updateHUD();
                    bugs.splice(i, 1);

                    if (lives <= 0) {
                        gameOver();
                    }
                }
            }
        }

        function updateHUD() {
            document.getElementById("score-val").innerText = score;
            document.getElementById("level-val").innerText = level;
            document.getElementById("life-val").innerText = "❤️".repeat(Math.max(0, lives));
        }

        function gameOver() {
            isGameRunning = false;
            document.getElementById("final-score").innerText = score;
            document.getElementById("game-over-screen").style.display = "flex";
        }

        // 캔버스 그리기 (벌레 및 타겟 영역 시각화)
        function drawCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (!isGameRunning) return;

            // 벌레 출력
            bugs.forEach(b => {
                ctx.save();
                ctx.font = "36px sans-serif";
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                
                // 캔버스가 좌우 반전(scaleX(-1))되어 있으므로 텍스트가 뒤집히지 않도록 처리
                ctx.translate(b.x, b.y);
                ctx.scale(-1, 1); 

                const icon = (b.type === 'roach') ? "🪳" : "🪰";
                ctx.fillText(icon, 0, 0);
                ctx.restore();
            });
        }

        // 페이지 로드 후 즉시 TM 초기화
        window.onload = initTM;
    </script>
</body>
</html>
